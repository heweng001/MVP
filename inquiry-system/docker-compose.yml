services:
  inquiry-system:
    build: .
    container_name: inquiry-system
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env.production
    environment:
      DATABASE_URL: file:/app/data/prod.db
    volumes:
      - inquiry_data:/app/data

volumes:
  inquiry_data:
